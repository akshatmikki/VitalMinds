name: Build Android APK

# Builds a debug APK on GitHub's servers so it can be downloaded and
# sideloaded onto a phone without installing Android Studio locally.
# The app itself loads the live Vercel deployment at runtime (see
# capacitor.config.ts), so this workflow only needs to rebuild when the
# native shell, Capacitor config, or plugins change.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # @capacitor/android 8.x requires sourceCompatibility 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default ("tools platform-tools") fails: the legacy
          # "tools" package no longer exists in current SDK repositories.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Sync Capacitor native project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vitalmind-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
